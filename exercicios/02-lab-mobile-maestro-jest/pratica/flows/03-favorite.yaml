# Flow 3 — Favoritar na lista e verificar na tela de Favoritos (asserção cross-tela).
# Conceito: ação numa tela (favoritar) reflete em outra (Favoritos) + contador.
appId: com.puciec.cinefav
---
- launchApp:
    clearState: true

# Chamada do fragmento de login reutilizável
- runFlow: fragments/login.yaml

# Favorite o filme "Matrix" tocando no coração do card — id "movie-card-heart-603"
- tapOn:
    id: "movie-card-heart-603"

# Abra os Favoritos pelo botão do header — id "movielist-favorites-button"
- tapOn:
    id: "movielist-favorites-button"

# AssertVisible do item favoritado — id "favorites-item-603"
- assertVisible:
    id: "favorites-item-603"

# AssertVisible do contador "1 favorito"
- assertVisible: "1 favorito"