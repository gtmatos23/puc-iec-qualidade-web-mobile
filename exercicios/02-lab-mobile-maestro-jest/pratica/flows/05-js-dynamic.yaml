# ⭐ OPCIONAL — prática extra, NÃO vale nota (a entrega são os flows 02 e 03).
# Flow 5 — JavaScript embutido (evalScript).
# Conceito: evalScript roda JS inline; o que grava em `output` é lido via ${output.campo}.
# (runScript: é pra ARQUIVO .js — pra JS inline use evalScript.)
appId: com.puciec.cinefav
---
- launchApp:
    clearState: true

# Login reutilizando o fragmento
- runFlow: fragments/login.yaml

# Sorteia um título e armazena na variável output.termo
- evalScript: ${output.termo = ['Matrix', 'Avatar', 'Interestelar'][Math.floor(Math.random() * 3)]}

# Abre a tela de busca pelo header
- tapOn:
    id: "movielist-search-button"

- assertVisible:
    id: "search-screen"

# Digita o termo sorteado no campo de pesquisa
- tapOn:
    id: "search-input"
- inputText: ${output.termo}

# Valida que o título sorteado está visível no resultado
- assertVisible: ${output.termo}