# Flow 4 — Abrir o detalhe do filme, favoritar lá dentro e voltar pra lista.
# Conceito: navegação entre telas + asserções em cada uma.
appId: com.puciec.cinefav
---
- launchApp:
    clearState: true

# Faz login usando o fragmento reutilizável
- runFlow: fragments/login.yaml

# Toque no card do filme "Matrix" — id "movie-card-603"
- tapOn:
    id: "movie-card-603"

# AssertVisible da tela de detalhe — id "detail-screen"
- assertVisible:
    id: "detail-screen"

# Favorite no detalhe — id "detail-favorite-button"
- tapOn:
    id: "detail-favorite-button"

# Volte pra lista — id "detail-back-button"
- tapOn:
    id: "detail-back-button"

# AssertVisible da lista de novo — id "movielist-screen"
- assertVisible:
    id: "movielist-screen"