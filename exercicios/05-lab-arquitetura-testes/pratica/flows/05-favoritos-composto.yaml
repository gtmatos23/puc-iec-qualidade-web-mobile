# 🔴🔴 NÍVEL 5 (desafio): flow longo que COMPÕE tudo — fragmento de login + POM.
# História: favorita Matrix → abre Favoritos → vê "1 favorito" → remove → a lista fica vazia.
# Dicas: o botão de remover é o id "favorites-item-603-remove" · a lista vazia mostra o id "favorites-empty"
appId: com.puciec.cinefav
tags:
  - smoke
  - regressao
---
- launchApp
- runFlow: _fragments/login.yaml
- runScript: elements/movielist.js

# 1. Favorita o Matrix via Page Object
- tapOn:
    id: ${output.lista.coracaoMatrix}

# 2. Abre a tela de Favoritos via Page Object e valida a contagem
- tapOn:
    id: ${output.lista.botaoFavoritos}
- assertVisible: "1 favorito"

# 3. Remove o Matrix da lista de favoritos
- tapOn:
    id: "favorites-item-603-remove"

# 4. Valida que o item não está mais visível e que a tela vazia é exibida
- assertNotVisible:
    id: "favorites-item-603"
- assertVisible:
    id: "favorites-empty"