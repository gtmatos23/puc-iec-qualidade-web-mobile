# ✅ AVALIATIVO — NÍVEL 1 (guiado, ANTES do intervalo): REFATORE este flow.
# Dá pra editar SEM emulador (é só YAML); quem tem emulador roda `maestro test flows/00-refatorar.yaml`.
#
# Ele PASSA, mas tem "cheiros":
#   🦨 login copiado passo a passo (já existe _fragments/login.yaml)
#   🦨 favoritar o filme 603 e o 27205: o mesmo passo escrito 2×, com o id colado no flow
#   🦨 lê como infraestrutura, não como uma história do usuário
#
# Sua missão (juntos, ~20 min):
#   1. Troque o login inteiro por UMA linha: runFlow: _fragments/login.yaml
#   2. Crie _fragments/favoritar.yaml (recebe ${MOVIE_ID}) e chame 2× com env diferente
#   3. Resultado: nenhum id de login e nenhum "movie-card-heart-…" escrito neste arquivo
appId: com.puciec.cinefav
tags:
  - regressao
---
- launchApp

# 1. Login reaproveitado via fragmento
- runFlow: _fragments/login.yaml

# 2. Favorita o primeiro filme (ID: 603)
- runFlow:
    file: _fragments/favoritar.yaml
    env:
      MOVIE_ID: "603"

# 3. Favorita o segundo filme (ID: 27205)
- runFlow:
    file: _fragments/favoritar.yaml
    env:
      MOVIE_ID: "27205"

# 4. Navega para a tela de favoritos e valida
- tapOn:
    id: "movielist-favorites-button"
- assertVisible:
    id: "favorites-item-603"
- assertVisible:
    id: "favorites-item-27205"
- assertVisible: "2 favoritos"
